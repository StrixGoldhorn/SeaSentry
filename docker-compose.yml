services:

  db:
    image: postgis/postgis:16-3.4
    container_name: seasentry-db

    env_file:
        - .env.docker

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  backend:
    build:
      context: ./backend

    container_name: seasentry-backend

    env_file:
      - .env.docker

    ports:
      - "5000:5000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backend:/app

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: seasentry-frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    restart: no

volumes:
  postgres_data: