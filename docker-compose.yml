services:

  db:
    image: postgis/postgis:16-3.4
    container_name: seasentry-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

    restart: unless-stopped

  backend:
    build:
      context: ./backend

    container_name: seasentry-backend

    env_file:
      - .dockerenv

    ports:
      - "5000:5000"

    depends_on:
      - db

    volumes:
      - ./backend:/app

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: seasentry-frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    restart: no

volumes:
  postgres_data: